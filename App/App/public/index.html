      <h1 style="font-size:34px;margin:0 0 8px">Analiz ProX — Kurumunuzun röntgenini çekin</h1>
      <p style="font-size:18px;color:#b9c0d6">ProX Yedilisi: işletmelerin güçlü ve zayıf yanlarını bilimsel yöntemlerle ölçen yedi analiz paneli tek uygulamada. Çalışanlar hesap açmadan, anonim olarak yanıtlar; rapor otomatik oluşur.</p>
      <h2 style="font-size:22px;margin-top:28px">Yedi analiz paneli</h2>
      <ul>
        <li><b>360° İşletme Röntgeni</b> — Güvenlikten liderliğe on alanda işletmenin bütüncül sağlık taraması ve eNPS.</li>
        <li><b>Güven &amp; Psikolojik Güvenlik</b> — Çalışanlar yöneticilerine, ekiplerine ve sisteme ne kadar güveniyor?</li>
        <li><b>Kurumsal Stres &amp; Dayanıklılık</b> — Stresin kaynağını bulun: iş yükü mü, yönetim mi, belirsizlik mi?</li>
        <li><b>Toplantı Verimliliği</b> — Toplantılarınız ne kadar değer üretiyor ve size kaça mal oluyor?</li>
        <li><b>Senaryo Planlama &amp; Kriz Hazırlığı</b> — Üç kriz senaryosunda beş kritik alanın hazırlık düzeyi ve risk maruziyeti.</li>
        <li><b>Vizyon &amp; İletişim Uyumu</b> — Strateji kâğıtta mı kalıyor, yoksa herkes aynı yöne mi bakıyor?</li>
        <li><b>İK Aday Değerlendirme</b> — Bilişsel yetenek, durumsal yargı, kişilik ve dürüstlük tek raporda; pozisyona uyum skoru.</li>
      </ul>
      <h2 style="font-size:22px;margin-top:28px">Kurum Röntgeni ve Claude ile Derin Analiz</h2>
      <p>Tüm panellerin sonuçları tek radar grafiğinde birleşir: en güçlü ve en zayıf alanlar, alanlar arası bağlantılar ve öncelikli aksiyonlar. Abonelikte Anthropic'in Claude yapay zekâsı sonuçlarınızı bir iş danışmanı gibi yorumlar ve İK adaylarınız için kişiye özel mülakat rehberi hazırlar.</p>
      <h2 style="font-size:22px;margin-top:28px">Nasıl çalışır?</h2>
      <ol><li>Kayıt olun ve kurumunuzu tanımlayın.</li><li>Değerlendirme başlatın; bağlantıyı veya QR kodu paylaşın.</li><li>Çalışanlar anonim yanıtlar; rapor otomatik oluşur (etki analizi, birim ısı haritası, 90 günlük aksiyon önerileri, PDF ve CSV).</li></ol>
      <p><b>30 gün ücretsiz deneme.</b> Web, Android, iOS ve Windows'ta aynı hesap. Türkçe ve İngilizce.</p>
