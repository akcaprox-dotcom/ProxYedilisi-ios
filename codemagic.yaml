# =====================================================================
#  Analiz ProX — iOS (Capacitor 8 + Swift Package Manager)
#  Bu depo tek başına derlenir: npm / node_modules / cap sync YOK.
#  Codemagic → bu depo → "ios-release" → Start new build
#  Her yeni yüklemede BUILD_NO'yu 1 artırın. Mağazada onaylanan sürümden sonra MARKETING_VERSION'ı da yükseltin.
# =====================================================================
workflows:
  ios-release:
    name: Analiz ProX iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: identityx_api_key
    environment:
      groups:
        - code_signing                 # CERTIFICATE_PRIVATE_KEY (diğer uygulamalarınızdakiyle AYNI değer)
      vars:
        BUNDLE_ID: "com.barisakca.analizprox"
        XCODE_PROJECT: "App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUILD_NO: "1"
        MARKETING_VERSION: "1.0"
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: İmzalama dosyalarını al
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Sürüm ve yapı numarası
        script: |
          cd App
          agvtool new-version -all "$BUILD_NO"
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $MARKETING_VERSION;/g" App.xcodeproj/project.pbxproj
      - name: IPA oluştur
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
